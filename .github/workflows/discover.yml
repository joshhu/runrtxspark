name: Daily GitHub discovery

on:
  schedule:
    # 19:17 UTC is 03:17 in Taiwan. GitHub can start scheduled runs hours late (nearly
    # three on 2026-11-01), and this has to finish before the 07:05 daily review.
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/discover-github.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
