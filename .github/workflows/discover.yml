name: Daily discovery

on:
  schedule:
    # 19:17 UTC is 03:17 in Taiwan. GitHub can start scheduled runs hours late (nearly
    # three on 2026-11-01), and this has to finish before the 07:05 daily review.
    - cron: '17 19 * * *'
  workflow_dispatch:

concurrency:
  group: discover
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/discover-github.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/sync-sources.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/validate-data.mjs
      - name: Publish the refreshed index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add data/index
          if git diff --cached --quiet; then
            echo "The index did not change."
            exit 0
          fi
          git config user.name "runrtxspark bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh the software index"
          git pull --rebase origin main
          git push origin main
          # A push made with GITHUB_TOKEN does not trigger other workflows, so start the deploy here.
          gh workflow run deploy.yml --ref main
